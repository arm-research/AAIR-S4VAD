# -------------------------------------------------
# Model
# -------------------------------------------------
model: "s4vad"                                      # Model architecture name
model_cfg:
  arch_cfg:
    feat_dim: 64                                    # Input feature dimension
    d_model: 64                                     # Model hidden dimension
    T: [201, 201, 201, 201]                          # Temporal sequence length per layer
    N: 64                                           # State size / channel dimension
    dt_min: [0.60, 0.60, 0.60, 0.60]                # Minimum S4 time-step range per layer
    dt_max: [1.00, 1.00, 1.00, 1.00]                # Maximum S4 time-step range per layer
    num_layers: 4                                   # Number of model layers
    dropout: 0.1                                    # Dropout probability
    causal: True                                    # Enable causal (streaming-safe) mode
  sample_rate: !ref <common_cfg[sample_rate]>       # Reuse global sample rate
  segment_ms: !ref <common_cfg[segment_ms]>         # Reuse segment duration
  mel_cfg: !ref <common_cfg[mel_cfg]>               # Reuse mel configuration
  melspec: "none"                                   # Mel generation method
  preprocess: !ref <common_cfg[preprocess]>         # Reuse preprocessing method
  streaming: True                                   # Enable streaming inference
  on_threshold: 0.8                                 # VAD activation threshold
  off_threshold: 0.4                                # VAD deactivation threshold
  hard_decision: False                              # Use probabilistic output
  median_kernel_size: 1                             # Median filter kernel size
  path: ./checkpoints/s4vad_10ms.pth                  # Pretrained 10-ms S4VAD weights


# -------------------------------------------------
# Evaluator
# -------------------------------------------------
evaluator: "vad_evaluator"                          # Evaluator implementation
evaluator_cfg:
    streaming: !ref <model_cfg[streaming]>          # Match model streaming mode

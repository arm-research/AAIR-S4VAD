# ###########################################
# Setup Configuration
# ###########################################


# -------------------------------------------------
# Common
# -------------------------------------------------
common_cfg:
   experiment_name: "s4vad"                         # Experiment identifier (voice activity detection)
   sample_rate: 16000                               # Audio sampling rate in Hz
   segment_ms: 3000                                  # Length of each audio segment in milliseconds
   preprocess: 'fft'                                # Audio preprocessing method
   mel_cfg:
     n_mels: 64                                     # Number of mel frequency bins
     n_fft: 512                                     # FFT window size
     win_length: 480                                # STFT window length (samples)
     hop_length: 160                                # STFT hop length (samples)
     f_min: 0                                       # Minimum mel frequency (Hz)
     f_max: 8000                                    # Maximum mel frequency (Hz)
     center: False                                  # Disable frame-centering padding

# -------------------------------------------------
# Dataset
# -------------------------------------------------
dataset: "librispeech"                               # Name of the dataset used for VAD training
dataset_cfg:
  val_ds:
    path: ./data/LibriSpeech/test-clean.json        # Path to the validation speech dataset
    noise_path: ./data/DNS2023/test.json            # Path to the validation noise dataset
    sample_rate: !ref <common_cfg[sample_rate]>     # Audio sampling rate for validation data
    mel_cfg: !ref <common_cfg[mel_cfg]>             # Mel-spectrogram configuration for validation
    preprocess: !ref <common_cfg[preprocess]>       # Audio preprocessing method for validation
    segment_ms: !ref <common_cfg[segment_ms]>       # Validation segment length
    segment_hop_ms: 10                              # Hop size between validation segments
    num_workers: 0                                  # Number of validation dataloader workers
    snrs: [-10,5,0,5,10]                            # SNR validation levels



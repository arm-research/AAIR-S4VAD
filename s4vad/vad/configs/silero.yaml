# -------------------------------------------------
# Model
# -------------------------------------------------
model: "silero"
model_cfg:
  sample_rate: !ref <common_cfg[sample_rate]>
  mel_cfg: !ref <common_cfg[mel_cfg]>
  melspec: "none" # 'none', 'fft' or 'conv'
  preprocess: !ref <common_cfg[preprocess]>
  on_threshold: 0.5
  off_threshold: 0.2
  hard_decision: False


# -------------------------------------------------
# Evaluator
# -------------------------------------------------
evaluator: "noisy_onset_evaluator"
evaluator_cfg:
    deltaL: 10
    deltaR : 10
